[package]
name = "SGIIPP-IPSCANER"
version = "2.4.1"
description = "SGIIPP-IPSCANER: escáner de red (nombre, IP, MAC, sistema, RAM y discos)"
edition = "2021"

[lib]
name = "ip_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "net", "time", "fs", "rt-multi-thread", "macros"] }
if-addrs = "0.13"
dns-lookup = "2"
hostname = "0.4"
mac_address = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
